[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jhoc"
version = "0.1.0"
description = "Zero-Trust Context Orchestration Framework for LLM Autonomous Workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
security = [
    "cryptography>=41.0.0",
]
dev = [
    "jsonschema>=4.20.0",
    "cryptography>=41.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
